services:
  factmatrix:
    build: .
    container_name: factmatrix-app
    ports:
      - "8501:8501"
    networks:
      - factmatrix-net
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: factmatrix-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - factmatrix-net
    restart: always
    # ❌ NO ports exposed (important)

  grafana:
    image: grafana/grafana
    container_name: factmatrix-grafana
    networks:
      - factmatrix-net
    restart: always
    # ❌ NO ports exposed (important)

networks:
  factmatrix-net:
    driver: bridge
