version: "3.9"

services:
  factmatrix:
    build: .
    ports:
      - "8501:8501"
    restart: always
    depends_on:
      - prometheus
    networks:
      - factmatrix-net

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    networks:
      - factmatrix-net

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    restart: always
    networks:
      - factmatrix-net

networks:
  factmatrix-net:
    driver: bridge
