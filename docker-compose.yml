services:
  factmatrix-app:
    build: .
    image: factmatrix-ci-factmatrix-app
    networks:
      - factmatrix-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - factmatrix-net

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - factmatrix-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - factmatrix-net

networks:
  factmatrix-net:
    driver: bridge
